[package]
name = "rtree"
version = "0.1.2"
description = "A fast, configurable directory tree viewer that shows child counts"
license = "MIT"
repository = "https://github.com/AFaria20s/rtree"
readme = "README.md"
keywords = ["cli", "tree", "filesystem", "directory"]
categories = ["command-line-utilities", "filesystem"]
edition = "2024"
rust-version = "1.85"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
colored = "3"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"
