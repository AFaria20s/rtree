[package]
name = "rtree"
version = "0.1.0"
description = "A fast, configurable directory tree viewer"
license-file = "LICENSE"
repository = "https://github.com/your-username/rtree"
keywords = ["cli", "tree", "filesystem", "directory"]
categories = ["command-line-utilities", "filesystem"]
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"
